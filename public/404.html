<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyVault - Loading...</title>
    <style>
      body {
        background-color: #050505;
        color: #ffffff;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
    </style>
    <script>
      // Single Page Application redirect for GitHub Pages
      (function() {
        var l = window.location;
        var pathSegments = l.pathname.slice(1).split('/');
        var isGithubIo = l.hostname.endsWith('github.io');
        // If repo name is the first segment (e.g. username.github.io/repo-name)
        var repoName = (isGithubIo && pathSegments.length > 0 && pathSegments[0]) ? pathSegments[0] : '';
        
        var repoPrefix = repoName ? '/' + repoName : '';
        var remainingPath = repoName ? pathSegments.slice(1).join('/') : pathSegments.join('/');

        var redirectTarget = l.protocol + '//' + l.host + repoPrefix + '/?' +
          (remainingPath ? '/' + remainingPath : '') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;

        l.replace(redirectTarget);
      })();
    </script>
  </head>
  <body>
    <div style="text-align: center;">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: #00f0ff; font-weight: bold; font-size: 1.15rem;">
        SV
      </div>
      <h2 style="font-size: 1.25rem; font-weight: 700; color: #ffffff; margin-bottom: 0.5rem; letter-spacing: -0.02em;">StudyVault</h2>
      <p style="color: #94a3b8; font-size: 0.875rem; margin: 0;">Restoring page route...</p>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyVault - Student Study-Material Platform</title>
    <meta name="description" content="Free student study-material sharing platform with real-time course search, PDF note preview and uploads, and Supabase integration." />
    <meta property="og:title" content="StudyVault - Student Study-Material Platform" />
    <meta property="og:description" content="Free student study-material sharing platform with real-time course search, PDF note preview and uploads, and Supabase integration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      html, body {
        background-color: #05070a;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
    </style>
    <script>
      // Ensure trailing slash on GitHub Pages directory URLs so relative assets resolve properly
      if (window.location.hostname.endsWith('github.io') && 
          window.location.pathname.length > 1 && 
          !window.location.pathname.endsWith('/') && 
          !window.location.pathname.split('/').pop().includes('.')) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body class="bg-[#05070a] text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Automatic fallback when GitHub Pages serves raw /index.html from repository root "/ (root)"
      (function () {
        var isViteDev = !!document.querySelector('script[src*="@vite/client"]');
        var rawEntry = document.querySelector('script[src*="src/main.tsx"]');
        if (!isViteDev && rawEntry) {
          rawEntry.remove();
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './assets/app.css';
          css.onerror = function () {
            css.href = './docs/assets/app.css';
          };
          document.head.appendChild(css);

          var js = document.createElement('script');
          js.type = 'module';
          js.src = './assets/app.js';
          js.onerror = function () {
            var fallbackJs = document.createElement('script');
            fallbackJs.type = 'module';
            fallbackJs.src = './docs/assets/app.js';
            document.body.appendChild(fallbackJs);
          };
          document.body.appendChild(js);
        }
      })();
    </script>
  </body>
</html>

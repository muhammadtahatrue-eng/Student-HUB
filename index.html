<!doctype html>
<html lang="en" style="background-color: #050505; color: #ffffff;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyVault - Student Study-Material Platform</title>
    <meta name="description" content="Free student study-material sharing platform with real-time course search, PDF note preview and uploads, and Supabase integration." />
    <meta property="og:title" content="StudyVault - Student Study-Material Platform" />
    <meta property="og:description" content="Free student study-material sharing platform with real-time course search, PDF note preview and uploads, and Supabase integration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      html, body {
        background-color: #050505 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
    </style>
    <script>
      // 1. Dynamic base URL resolution for GitHub Pages subpaths & custom domains
      (function() {
        try {
          var loc = window.location;
          var pathname = loc.pathname;

          // Calculate correct directory path ending with '/'
          var baseDir = pathname;
          if (baseDir.split('/').pop().includes('.')) {
            baseDir = baseDir.substring(0, baseDir.lastIndexOf('/') + 1);
          } else if (!baseDir.endsWith('/')) {
            baseDir = baseDir + '/';
          }

          // Inject or update base tag so all relative assets (./assets/...) resolve accurately
          var base = document.querySelector('base');
          if (!base) {
            base = document.createElement('base');
            base.href = loc.origin + baseDir;
            document.head.insertBefore(base, document.head.firstChild);
          } else {
            base.href = loc.origin + baseDir;
          }

          // Decode SPA redirect from 404.html if present
          if (loc.search && loc.search.length > 1) {
            var searchParams = loc.search.slice(1);
            if (searchParams.startsWith('/')) {
              var parts = searchParams.split('&').map(function(s) {
                return s.replace(/~and~/g, '&');
              });
              var restoredPath = parts[0];
              var restoredQuery = parts.slice(1).join('&');
              var newUrl = baseDir + (restoredPath.startsWith('/') ? restoredPath.slice(1) : restoredPath) +
                (restoredQuery ? '?' + restoredQuery : '') +
                loc.hash;
              window.history.replaceState(null, '', newUrl);
            }
          }
        } catch (e) {
          console.warn('URL normalizer error:', e);
        }
      })();

      // 2. Global diagnostic handler: catches load issues and displays helpful recovery info
      window.addEventListener('error', function(e) {
        var fb = document.getElementById('app-loading-fallback');
        if (fb) {
          var log = document.getElementById('app-error-log');
          if (!log) {
            log = document.createElement('div');
            log.id = 'app-error-log';
            log.style = 'margin-top: 1rem; max-width: 480px; padding: 0.75rem 1rem; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 10px; font-family: monospace; font-size: 0.72rem; color: #fca5a5; text-align: left; word-break: break-all;';
            fb.appendChild(log);
          }
          var targetSrc = (e.target && e.target.src) ? e.target.src : '';
          var msg = e.message || (targetSrc ? ('Resource failed to load: ' + targetSrc) : 'Script loading error');
          log.innerHTML = '<strong>Notice:</strong> ' + msg + '<br/><span style="color:#94a3b8;font-size:0.68rem;">Base: ' + (document.baseURI || window.location.href) + '</span>';
        }
      }, true);

      window.__studyVaultHardReset = function() {
        try {
          localStorage.clear();
          sessionStorage.clear();
          if (window.caches) {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            });
          }
        } catch (err) {}
        window.location.reload();
      };
    </script>
  </head>
  <body class="bg-[#050505] text-white">
    <div id="root">
      <!-- Fallback shown before React mounts or if initial network fetch is pending -->
      <div id="app-loading-fallback" style="min-height: 100vh; background-color: #050505; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 1.5rem; text-align: center;">
        <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; color: #00f0ff; font-weight: bold; font-size: 1.25rem;">
          SV
        </div>
        <h1 style="font-size: 1.25rem; font-weight: 700; margin: 0 0 0.5rem 0; letter-spacing: -0.025em; color: #ffffff;">StudyVault</h1>
        <p style="font-size: 0.875rem; color: #94a3b8; margin: 0 0 1.5rem 0; max-width: 320px;">
          Loading student resources and academic programs...
        </p>
        <div style="display: flex; gap: 0.75rem;">
          <button onclick="window.location.reload()" style="background-color: #00f0ff; color: #000000; border: none; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer;">
            Reload
          </button>
          <button onclick="window.__studyVaultHardReset()" style="background-color: rgba(255, 255, 255, 0.1); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.15); padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer;">
            Reset Cache
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
